name: Noise
description: 'Noise is a consumer "attention markets" / trend-prediction platform built on Base
  where curators propose trend pages and communities trade markets on how relevant a topic, brand,
  or movement becomes over time. Market price reflects a central "relevance" number, with funding
  and liquidation mechanics familiar from perpetual markets. Noise raised a $7.1M seed round led by
  Paradigm and launched an invite-only testnet beta. It is a mobile-first consumer app rather than a
  developer platform; its public surface is product documentation (Mintlify) at docs.noise.xyz — no
  first-party developer API, SDKs, or authentication scheme is currently published.'
